<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="tb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#tb-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">VARIANT CLASSIFIER // AWS LAMBDA INFERENCE</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', 'Consolas', monospace" font-size="9" fill="#9e9177">M. TUBERCULOSIS VCF</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- VCF Variant Barcode Track -->
  <g transform="translate(35, 78)">
    <text x="0" y="12" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#c4b89d">CHROMOSOME 1 : RESISTANCE MUTATIONS (SNPs/INDELs)</text>
    <rect x="0" y="20" width="530" height="26" fill="#201a12" stroke="#4a3e28" />
    <!-- SNP Markers in Amber and Gold -->
    <rect x="45" y="20" width="4" height="26" fill="#f5b738" />
    <rect x="88" y="20" width="3" height="26" fill="#ffd56b" />
    <rect x="140" y="20" width="6" height="26" fill="#f5b738" />
    <rect x="230" y="20" width="4" height="26" fill="#f5b738" />
    <rect x="310" y="20" width="3" height="26" fill="#c48b4e" />
    <rect x="420" y="20" width="5" height="26" fill="#f5b738" />
    <rect x="490" y="20" width="4" height="26" fill="#ffd56b" />

    <text x="5" y="58" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#8f846d">POS 1..4411532 bp</text>
    <text x="525" y="58" text-anchor="end" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#ffd56b">HIGH-CONFIDENCE AMR MUTATIONS</text>
  </g>

  <!-- Serverless Cloud Inference Pipeline Flow (Each stage wrapped in its own translated group) -->
  <g transform="translate(35, 165)">
    <!-- Stage 1: S3 Trigger -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="145" height="98" fill="#1b1710" stroke="#4a3e28" />
      <text x="12" y="24" font-family="'Space Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#f5b738">S3 BUCKET</text>
      <text x="12" y="46" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#c4b89d">Event: PutObject</text>
      <text x="12" y="62" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#8f846d">*.vcf.gz upload</text>
      <text x="12" y="80" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#ffd56b">Sub-second trigger</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="145" y1="49" x2="185" y2="49" stroke="#f5b738" stroke-width="1.5" stroke-dasharray="4,3" />
    <polygon points="188,49 180,45 180,53" fill="#f5b738" />

    <!-- Stage 2: Lambda / Docker Container -->
    <g transform="translate(190, 0)">
      <rect x="0" y="0" width="150" height="98" fill="#1b1710" stroke="#4a3e28" />
      <text x="12" y="24" font-family="'Space Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#f5b738">AWS LAMBDA</text>
      <text x="12" y="46" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#c4b89d">cyvcf2 + Docker</text>
      <text x="12" y="62" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#8f846d">Random Forest model</text>
      <text x="12" y="80" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#ffd56b">Automated Pytest</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="340" y1="49" x2="380" y2="49" stroke="#f5b738" stroke-width="1.5" stroke-dasharray="4,3" />
    <polygon points="383,49 375,45 375,53" fill="#f5b738" />

    <!-- Stage 3: Output Accuracy Gauge -->
    <g transform="translate(385, 0)">
      <rect x="0" y="0" width="145" height="98" fill="#1f1911" stroke="#f5b738" stroke-width="1.5" />
      <text x="12" y="24" font-family="'Space Mono', 'Consolas', monospace" font-size="9" font-weight="700" fill="#f5b738">INFERENCE</text>
      <text x="12" y="60" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="32" font-weight="700" fill="#f5b738">82%</text>
      <text x="68" y="48" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#ffd56b">MODEL</text>
      <text x="68" y="60" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#ffd56b">ACCURACY</text>
      <text x="12" y="82" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#c4b89d">RESISTANT: RIF/INH</text>
    </g>
  </g>

  <!-- Metrics Bar -->
  <text x="35" y="365" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#f5b738">
    CYVCF2 + AWS LAMBDA DOCKER INFERENCE // EVENT-DRIVEN S3 WORKFLOW // SUB-SECOND LATENCY
  </text>
</svg>
