      <circle cx="68" cy="70" r="6" fill="#f5b738" />
    </g>

    <!-- YOLO Bounding Box 2 (Secondary Lesion in Gold, Disjoint Lower-Right of Leaf) -->
    <g transform="translate(295, 115)">
      <rect x="0" y="18" width="125" height="85" fill="none" stroke="#ffd56b" stroke-width="1.5" stroke-dasharray="4,2" />
