    <line x1="210" y1="150" x2="245" y2="85" stroke="#524027" stroke-width="1.5" />
    <line x1="265" y1="120" x2="245" y2="175" stroke="#524027" stroke-width="1.5" />
    <line x1="315" y1="90" x2="340" y2="135" stroke="#524027" stroke-width="1.5" />

    <!-- YOLO Bounding Box 1 (Primary Pathogen - Early Blight in Amber, Upper-Left of Leaf) -->
    <g transform="translate(130, 65)">
      <rect x="0" y="18" width="135" height="105" fill="none" stroke="#f5b738" stroke-width="2" stroke-dasharray="4,2" />
