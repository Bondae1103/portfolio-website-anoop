<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rag-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5b738" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" fill="url(#rag-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />
  
  <!-- Subtle Background Grid Guidelines -->
  <line x1="15" y1="155" x2="585" y2="155" stroke="#282215" stroke-dasharray="2,4" />
  <line x1="15" y1="340" x2="585" y2="340" stroke="#282215" stroke-dasharray="2,4" />

  <!-- Top Header Bar -->
  <text x="35" y="45" font-family="'Space Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">PALEO-RAG // DISTRIBUTED HYBRID RETRIEVAL</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', 'Consolas', monospace" font-size="9" fill="#9e9177">FASTAPI · QDRANT · CELERY</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- Pipeline Flow: 4 Distinct Stages with Arrows -->
  <g transform="translate(35, 75)">
    <!-- Stage 1: Ingestion -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="112" height="68" fill="#1e1912" stroke="#4a3e28" stroke-width="1" />
      <text x="10" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="8.5" font-weight="700" fill="#f5b738">INGESTION</text>
      <text x="10" y="38" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">FastAPI + JATS</text>
      <text x="10" y="52" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">bioRxiv PDFs</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="112" y1="34" x2="135" y2="34" stroke="#f5b738" stroke-width="1.5" stroke-dasharray="3,2" />
    <polygon points="138,34 130,30 130,38" fill="#f5b738" />

    <!-- Stage 2: Message Queue -->
    <g transform="translate(142, 0)">
      <rect x="0" y="0" width="112" height="68" fill="#1e1912" stroke="#4a3e28" stroke-width="1" />
      <text x="10" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="8.5" font-weight="700" fill="#f5b738">MESSAGE QUEUE</text>
      <text x="10" y="38" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">Redis Broker</text>
      <text x="10" y="52" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">Celery Workers</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="254" y1="34" x2="277" y2="34" stroke="#f5b738" stroke-width="1.5" stroke-dasharray="3,2" />
    <polygon points="280,34 272,30 272,38" fill="#f5b738" />

    <!-- Stage 3: Hybrid Retrieval -->
    <g transform="translate(284, 0)">
      <rect x="0" y="0" width="138" height="68" fill="#1e1912" stroke="#f5b738" stroke-width="1.2" />
      <text x="10" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="8.5" font-weight="700" fill="#f5b738">HYBRID RETRIEVAL</text>
      <text x="10" y="38" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#ffd56b">Dense: PubMedBERT</text>
      <text x="10" y="52" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">Sparse: BM25 (RRF)</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="422" y1="34" x2="445" y2="34" stroke="#f5b738" stroke-width="1.5" stroke-dasharray="3,2" />
    <polygon points="448,34 440,30 440,38" fill="#f5b738" />

    <!-- Stage 4: Stream -->
    <g transform="translate(452, 0)">
      <rect x="0" y="0" width="78" height="68" fill="#1e1912" stroke="#4a3e28" stroke-width="1" />
      <text x="8" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="8.5" font-weight="700" fill="#f5b738">STREAM</text>
      <text x="8" y="38" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">SSE / LLM</text>
      <text x="8" y="52" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">Citation Tag</text>
    </g>
  </g>

  <!-- Left Lower: Evaluation Harness Console -->
  <g transform="translate(35, 168)">
    <rect x="0" y="0" width="345" height="150" fill="#16130d" stroke="#332a1c" />
    <text x="14" y="22" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#f5b738">EVALUATION HARNESS // GOLDEN SET (N=27)</text>
    
    <text x="14" y="48" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#bfae8c">
      &gt; QUERY: Neanderthal EPAS1 hypoxia adaptation...
    </text>
    <text x="14" y="70" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#ffd56b">
      &gt; STREAM: Denisovan introgressed haplotype [PMC4284632]
    </text>
    <text x="14" y="92" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">
      &gt; VERIFY: Cross-ref passage token citations... PASS
    </text>
    
    <!-- Progress Bar Metric -->
    <rect x="14" y="112" width="317" height="22" fill="#1e1a12" stroke="#3d3322" />
    <rect x="16" y="114" width="313" height="18" fill="url(#gold-grad)" opacity="0.9" />
    <text x="22" y="127" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#141006">
      CITATION FAITHFULNESS: 100.0% (0 HALLUCINATIONS)
    </text>
  </g>

  <!-- Right Lower: Benchmark Badges -->
  <g transform="translate(400, 168)">
    <!-- Badge 1: Benchmark Recall -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="165" height="68" fill="#1b1710" stroke="#4a3e28" />
      <text x="14" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#9e9177">BENCHMARK RECALL</text>
      <text x="14" y="52" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="28" font-weight="700" fill="#f5b738">100%</text>
      <text x="76" y="49" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#ffd56b">@5 RECALL</text>
    </g>

    <!-- Badge 2: Automated Tests -->
    <g transform="translate(0, 82)">
      <rect x="0" y="0" width="165" height="68" fill="#1b1710" stroke="#4a3e28" />
      <text x="14" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#9e9177">AUTOMATED TESTS</text>
      <text x="14" y="52" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="26" font-weight="700" fill="#f5b738">44 / 44</text>
      <text x="96" y="49" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#ffd56b">PYTEST</text>
    </g>
  </g>

  <!-- Bottom Terminal Bar -->
  <text x="35" y="365" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#f5b738">
    DOCKER COMPOSE // QDRANT DENSE+SPARSE RRF // FULL-TEXT JATS &amp; PREPRINT PDFS
  </text>
</svg>
