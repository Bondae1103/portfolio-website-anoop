<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="volc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#volc-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">TRANSCRIPTOMICS // MULTI-DATASET CONSENSUS</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', 'Consolas', monospace" font-size="9" fill="#9e9177">LIMMA + EDGER + SHAP</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- Volcano Plot Container (Left) -->
  <g transform="translate(45, 80)">
    <!-- Axes Grid Box -->
    <rect x="0" y="0" width="365" height="240" fill="#15120c" stroke="#332a1c" />

    <!-- Threshold Lines -->
    <!-- Significance FDR < 0.05 horizontal line -->
    <line x1="0" y1="140" x2="365" y2="140" stroke="#f5b738" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <text x="8" y="135" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#f5b738">FDR = 0.05</text>

    <!-- Fold-change vertical cutoffs -->
    <line x1="130" y1="0" x2="130" y2="240" stroke="#8a7959" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <line x1="235" y1="0" x2="235" y2="240" stroke="#8a7959" stroke-width="1" stroke-dasharray="3,3" opacity="0.4" />
    <line x1="182" y1="0" x2="182" y2="240" stroke="#2a2216" stroke-width="1" />

    <!-- Non-significant Scatter Cluster (Low significance) -->
    <g fill="#3a3020" opacity="0.65">
      <circle cx="180" cy="185" r="2" /><circle cx="190" cy="175" r="2" /><circle cx="175" cy="195" r="2.5" />
      <circle cx="185" cy="165" r="2" /><circle cx="170" cy="170" r="2" /><circle cx="195" cy="185" r="2" />
      <circle cx="165" cy="160" r="2" /><circle cx="205" cy="170" r="2" /><circle cx="180" cy="210" r="2.5" />
      <circle cx="155" cy="185" r="2" /><circle cx="215" cy="180" r="2" /><circle cx="190" cy="195" r="2" />
      <circle cx="150" cy="155" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="185" cy="150" r="2" />
      <circle cx="160" cy="148" r="2" /><circle cx="210" cy="148" r="2" /><circle cx="175" cy="145" r="2" />
      <circle cx="140" cy="165" r="2" /><circle cx="228" cy="165" r="2" /><circle cx="185" cy="180" r="3" />
      <circle cx="135" cy="180" r="2" /><circle cx="232" cy="175" r="2" /><circle cx="195" cy="160" r="2" />
    </g>

    <!-- Downregulated Significant Genes (Left upper quadrant in warm bronze) -->
    <g fill="#c48b4e">
      <circle cx="110" cy="115" r="3" /><circle cx="95" cy="95" r="3.5" /><circle cx="80" cy="80" r="4" />
      <circle cx="118" cy="125" r="2.5" /><circle cx="100" cy="105" r="3" /><circle cx="70" cy="65" r="4.5" />
      <circle cx="105" cy="75" r="3" /><circle cx="85" cy="110" r="3.5" /><circle cx="55" cy="48" r="5" fill="#f5b738" />
    </g>

    <!-- Upregulated Significant Genes (Right upper quadrant in gold) -->
    <g fill="#f5b738">
      <circle cx="260" cy="110" r="3.5" /><circle cx="275" cy="90" r="4" /><circle cx="290" cy="70" r="4.5" />
      <circle cx="250" cy="125" r="3" /><circle cx="270" cy="105" r="3.5" /><circle cx="305" cy="52" r="5" />
      <circle cx="280" cy="75" r="3.5" /><circle cx="295" cy="110" r="3" /><circle cx="320" cy="38" r="5.5" />
    </g>

    <!-- Gene Callout 1: SNCA -->
    <line x1="320" y1="38" x2="335" y2="24" stroke="#f5b738" stroke-width="1" />
    <rect x="305" y="14" width="54" height="18" fill="#241e14" stroke="#f5b738" stroke-width="1" />
    <text x="312" y="26" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#f5b738">SNCA ↑</text>

    <!-- Gene Callout 2: LRRK2 -->
    <line x1="305" y1="52" x2="315" y2="68" stroke="#ffd56b" stroke-width="1" />
    <rect x="298" y="68" width="61" height="18" fill="#241e14" stroke="#ffd56b" stroke-width="1" />
    <text x="304" y="80" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#ffd56b">LRRK2 ↑</text>

    <!-- Gene Callout 3: PRKN -->
    <line x1="55" y1="48" x2="40" y2="35" stroke="#c48b4e" stroke-width="1" />
    <rect x="12" y="24" width="54" height="18" fill="#241e14" stroke="#c48b4e" stroke-width="1" />
    <text x="18" y="36" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#c48b4e">PRKN ↓</text>

    <!-- Axis Labels -->
    <text x="182" y="258" text-anchor="middle" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#8a7c64">log2(Fold Change)</text>
    <text x="-120" y="-10" transform="rotate(-90)" text-anchor="middle" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#8a7c64">-log10(P-value)</text>
  </g>

  <!-- Right Side Telemetry Cards (Stacked with separate translate groups) -->
  <g transform="translate(425, 80)">
    <!-- Box 1: Feature Selection Methods -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="74" fill="#19150e" stroke="#4a3e28" />
      <text x="10" y="18" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#8f846d">FEATURE SELECTION</text>
      <text x="10" y="36" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">· LASSO</text>
      <text x="10" y="50" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">· Boruta</text>
      <text x="10" y="64" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">· SVM-RFE</text>
      <text x="74" y="36" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">· Mut Info</text>
      <text x="74" y="50" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#ffd56b">· LOOCV</text>
      <text x="74" y="64" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#ffd56b">· SHAP</text>
    </g>

    <!-- Box 2: Consensus Biomarkers Highlight -->
    <g transform="translate(0, 83)">
      <rect x="0" y="0" width="140" height="74" fill="#1e1912" stroke="#f5b738" stroke-width="1.2" />
      <text x="10" y="18" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#9e9177">CONSENSUS</text>
      <text x="10" y="52" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="30" font-weight="700" fill="#f5b738">12</text>
      <text x="46" y="42" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#ffd56b">BIOMARKERS</text>
      <text x="46" y="54" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#c4b89d">SIGNATURE</text>
      <text x="10" y="67" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#8f846d">SHAP EXPLAINABILITY</text>
    </g>

    <!-- Box 3: Cohort Validation -->
    <g transform="translate(0, 166)">
      <rect x="0" y="0" width="140" height="74" fill="#19150e" stroke="#4a3e28" />
      <text x="10" y="18" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#8f846d">VALIDATION</text>
      <text x="10" y="36" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#c4b89d">5 Cortex Datasets</text>
      <text x="10" y="50" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" fill="#f5b738">GSE48350 Cohort</text>
      <text x="10" y="64" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">Multi-Cohort Cross-Val</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <text x="35" y="365" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#f5b738">
    LIMMA-EDGER // 12 CONSENSUS BIOMARKERS // ENSEMBLE FEATURE ENGINEERING
  </text>
</svg>
