<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="volc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#volc-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">TRANSCRIPTOMICS // MULTI-DATASET CONSENSUS</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="#9e9177">LIMMA + EDGER + SHAP</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- Volcano Plot Container -->
  <g transform="translate(60, 80)">
    <!-- Axes Grid Box -->
    <rect x="0" y="0" width="370" height="230" fill="#15120c" stroke="#332a1c" />

    <!-- Threshold Lines -->
    <!-- Significance FDR < 0.05 horizontal line -->
    <line x1="0" y1="140" x2="370" y2="140" stroke="#f5b738" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <text x="5" y="136" font-family="'Space Mono', monospace" font-size="7" fill="#f5b738">FDR = 0.05</text>

    <!-- Fold-change vertical cutoffs -->
    <line x1="135" y1="0" x2="135" y2="230" stroke="#8a7959" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
    <line x1="235" y1="0" x2="235" y2="230" stroke="#8a7959" stroke-width="1" stroke-dasharray="3,3" opacity="0.5" />
    <line x1="185" y1="0" x2="185" y2="230" stroke="#2a2216" stroke-width="1" />

    <!-- Non-significant Scatter Cluster (Low significance) -->
    <!-- Background gray/brown particles -->
    <g fill="#332b1d" opacity="0.6">
      <circle cx="180" cy="180" r="2" /><circle cx="190" cy="175" r="2" /><circle cx="175" cy="190" r="2.5" />
      <circle cx="185" cy="165" r="2" /><circle cx="170" cy="170" r="2" /><circle cx="195" cy="185" r="2" />
      <circle cx="165" cy="160" r="2" /><circle cx="205" cy="170" r="2" /><circle cx="180" cy="205" r="2.5" />
      <circle cx="155" cy="185" r="2" /><circle cx="215" cy="180" r="2" /><circle cx="190" cy="195" r="2" />
      <circle cx="150" cy="155" r="2" /><circle cx="220" cy="160" r="2" /><circle cx="185" cy="150" r="2" />
      <circle cx="160" cy="145" r="2" /><circle cx="210" cy="148" r="2" /><circle cx="175" cy="142" r="2" />
      <circle cx="140" cy="165" r="2" /><circle cx="230" cy="165" r="2" /><circle cx="185" cy="180" r="3" />
      <circle cx="130" cy="180" r="2" /><circle cx="240" cy="175" r="2" /><circle cx="195" cy="160" r="2" />
    </g>

    <!-- Downregulated Significant Genes (Left upper quadrant) -->
    <g fill="#c48b4e">
      <circle cx="110" cy="115" r="3" /><circle cx="95" cy="95" r="3.5" /><circle cx="80" cy="80" r="4" />
      <circle cx="120" cy="125" r="2.5" /><circle cx="100" cy="105" r="3" /><circle cx="70" cy="65" r="4.5" />
      <circle cx="105" cy="75" r="3" /><circle cx="85" cy="110" r="3.5" /><circle cx="55" cy="45" r="5" fill="#f5b738" />
    </g>

    <!-- Upregulated Significant Genes (Right upper quadrant, high impact in gold) -->
    <g fill="#f5b738">
      <circle cx="260" cy="110" r="3.5" /><circle cx="275" cy="90" r="4" /><circle cx="290" cy="70" r="4.5" />
      <circle cx="250" cy="125" r="3" /><circle cx="270" cy="105" r="3.5" /><circle cx="305" cy="50" r="5" />
      <circle cx="280" cy="75" r="3.5" /><circle cx="295" cy="110" r="3" /><circle cx="320" cy="35" r="5.5" />
    </g>

    <!-- Biomarker Callouts -->
    <!-- SNCA -->
    <line x1="320" y1="35" x2="345" y2="25" stroke="#f5b738" stroke-width="1" />
    <rect x="345" y="15" width="55" height="18" fill="#241e14" stroke="#f5b738" stroke-width="1" />
    <text x="350" y="27" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#f5b738">SNCA ↑</text>

    <!-- LRRK2 -->
    <line x1="305" y1="50" x2="335" y2="60" stroke="#f5b738" stroke-width="1" />
    <rect x="335" y="52" width="60" height="18" fill="#241e14" stroke="#f5b738" stroke-width="1" />
    <text x="340" y="64" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#ffd56b">LRRK2 ↑</text>

    <!-- PRKN -->
    <line x1="55" y1="45" x2="30" y2="35" stroke="#c48b4e" stroke-width="1" />
    <rect x="5" y="25" width="55" height="18" fill="#241e14" stroke="#c48b4e" stroke-width="1" />
    <text x="10" y="37" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#c48b4e">PRKN ↓</text>

    <!-- Axis Labels -->
    <text x="185" y="245" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="#8a7c64">log2(Fold Change)</text>
    <text x="-115" y="-12" transform="rotate(-90)" text-anchor="middle" font-family="'Space Mono', monospace" font-size="7.5" fill="#8a7c64">-log10(P-value)</text>
  </g>

  <!-- Right Side Telemetry Card -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="115" height="70" fill="#19150e" stroke="#4a3e28" />
    <text x="10" y="18" font-family="'Space Mono', monospace" font-size="7" fill="#8f846d">FEATURE SELECTION</text>
    <text x="10" y="32" font-family="'Space Mono', monospace" font-size="7.5" fill="#c4b89d">· LASSO</text>
    <text x="10" y="44" font-family="'Space Mono', monospace" font-size="7.5" fill="#c4b89d">· Boruta</text>
    <text x="10" y="56" font-family="'Space Mono', monospace" font-size="7.5" fill="#c4b89d">· SVM-RFE</text>
    <text x="65" y="32" font-family="'Space Mono', monospace" font-size="7.5" fill="#c4b89d">· Mutual Info</text>
    <text x="65" y="44" font-family="'Space Mono', monospace" font-size="7.5" fill="#ffd56b">· LOOCV</text>

    <rect x="0" y="80" width="115" height="70" fill="#1e1912" stroke="#f5b738" stroke-width="1.2" />
    <text x="10" y="18" font-family="'Space Mono', monospace" font-size="7" fill="#9e9177">CONSENSUS</text>
    <text x="10" y="48" font-family="'Barlow Condensed', sans-serif" font-size="28" font-weight="700" fill="#f5b738">12</text>
    <text x="42" y="45" font-family="'Space Mono', monospace" font-size="8" fill="#ffd56b">BIOMARKERS</text>
    <text x="10" y="62" font-family="'Space Mono', monospace" font-size="6.5" fill="#8f846d">SHAP EXPLAINABILITY</text>

    <rect x="0" y="160" width="115" height="70" fill="#19150e" stroke="#4a3e28" />
    <text x="10" y="18" font-family="'Space Mono', monospace" font-size="7" fill="#8f846d">VALIDATION</text>
    <text x="10" y="38" font-family="'Space Mono', monospace" font-size="8" fill="#c4b89d">Cortex Datasets</text>
    <text x="10" y="52" font-family="'Space Mono', monospace" font-size="7.5" fill="#f5b738">GSE48350 Cohort</text>
    <text x="10" y="64" font-family="'Space Mono', monospace" font-size="6.5" fill="#8f846d">Multi-Cohort Cross</text>
  </g>

  <!-- Footer Telemetry -->
  <text x="35" y="365" font-family="'Space Mono', monospace" font-size="8" fill="#f5b738">
    LIMMA-EDGER // 12 CONSENSUS BIOMARKERS // ENSEMBLE FEATURE ENGINEERING
  </text>
</svg>
