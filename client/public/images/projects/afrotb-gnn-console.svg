<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gnn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b738" />
      <stop offset="100%" stop-color="#c48b4e" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gnn-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', 'Consolas', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">AFROTB // PHYLOGENY-AWARE GRAPH NEURAL NETWORK</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', 'Consolas', monospace" font-size="9" fill="#9e9177">PYTORCH GEOMETRIC · 13,753 ISOLATES</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- Left: Phylogenetic Tree Dendrogram -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="215" height="245" fill="#16130d" stroke="#382e1c" />
    <text x="12" y="22" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#f5b738">PHYLOGENETIC DIVERGENCE</text>
    <text x="12" y="36" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">SNP Distance Matrix (N=13,753)</text>

    <!-- Tree Branches (Kept within x=135 so lineage labels fit comfortably) -->
    <path d="M 25 125 L 55 125 L 55 75 L 95 75 L 95 55 L 138 55" fill="none" stroke="#f5b738" stroke-width="1.5" />
    <path d="M 95 75 L 95 95 L 138 95" fill="none" stroke="#ffd56b" stroke-width="1.5" />
    <path d="M 55 125 L 55 175 L 100 175 L 100 155 L 138 155" fill="none" stroke="#c48b4e" stroke-width="1.5" />
    <path d="M 100 175 L 100 200 L 138 200" fill="none" stroke="#9e7b41" stroke-width="1.5" />

    <!-- Terminal Lineage Nodes and Labels -->
    <circle cx="138" cy="55" r="4" fill="#f5b738" />
    <text x="148" y="58" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#f5b738">Lineage 4</text>

    <circle cx="138" cy="95" r="4" fill="#ffd56b" />
    <text x="148" y="98" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#ffd56b">Lineage 2</text>

    <circle cx="138" cy="155" r="4" fill="#c48b4e" />
    <text x="148" y="158" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#c48b4e">Lineage 1</text>

    <circle cx="138" cy="200" r="4" fill="#9e7b41" />
    <text x="148" y="203" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#9e7b41">Lineage 3</text>

    <!-- Calibration Bar -->
    <line x1="20" y1="228" x2="80" y2="228" stroke="#f5b738" stroke-width="2" />
    <text x="86" y="231" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#8f846d">500 SNPs div</text>
  </g>

  <!-- Right: GNN Topological Graph & Multi-Task Heads -->
  <g transform="translate(265, 75)">
    <!-- Topological Graph Canvas -->
    <rect x="0" y="0" width="300" height="155" fill="#16130d" stroke="#382e1c" />
    <text x="12" y="20" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#f5b738">GNN ISOLATE GRAPH (PyG)</text>
    <text x="12" y="34" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#8f846d">edge_index + edge_weight (SNP Threshold)</text>

    <!-- Graph Edges -->
    <line x1="55" y1="80" x2="115" y2="60" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="55" y1="80" x2="105" y2="110" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="115" y1="60" x2="185" y2="75" stroke="#f5b738" stroke-width="1.5" />
    <line x1="105" y1="110" x2="185" y2="75" stroke="#f5b738" stroke-width="1.5" />
    <line x1="115" y1="60" x2="160" y2="120" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="185" y1="75" x2="250" y2="65" stroke="#ffd56b" stroke-width="1.5" />
    <line x1="185" y1="75" x2="245" y2="115" stroke="#f5b738" stroke-width="1.5" />
    <line x1="160" y1="120" x2="245" y2="115" stroke="#4a3e28" stroke-width="1.2" />

    <!-- Graph Nodes -->
    <circle cx="55" cy="80" r="5" fill="#3d3322" stroke="#8a7959" />
    <circle cx="115" cy="60" r="6" fill="#1f1a12" stroke="#f5b738" stroke-width="1.5" />
    <circle cx="105" cy="110" r="5" fill="#1f1a12" stroke="#c48b4e" stroke-width="1.5" />
    <circle cx="185" cy="75" r="10" fill="#292015" stroke="#f5b738" stroke-width="2" />
    <text x="181" y="79" font-family="'Space Mono', 'Consolas', monospace" font-size="8" font-weight="700" fill="#f5b738">G</text>
    <circle cx="160" cy="120" r="5" fill="#3d3322" stroke="#8a7959" />
    <circle cx="250" cy="65" r="7" fill="#1f1a12" stroke="#ffd56b" stroke-width="1.5" />
    <circle cx="245" cy="115" r="6" fill="#1f1a12" stroke="#f5b738" stroke-width="1.5" />

    <!-- Joint Multi-Task Heads (Each wrapped in its own translated group) -->
    <g transform="translate(0, 168)">
      <!-- Head A: AMR Prediction -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="144" height="77" fill="#1b1710" stroke="#f5b738" stroke-width="1.2" />
        <text x="10" y="18" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#f5b738">HEAD A // AMR</text>
        <text x="10" y="34" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#c4b89d">12 WHO Drug Pheno</text>
        <text x="10" y="48" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#ffd56b">RIF / INH / EMB / PZA</text>
        <text x="10" y="62" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#8f846d">BCE Loss Optimization</text>
      </g>

      <!-- Head B: Lineage Classification -->
      <g transform="translate(156, 0)">
        <rect x="0" y="0" width="144" height="77" fill="#1b1710" stroke="#4a3e28" />
        <text x="10" y="18" font-family="'Space Mono', 'Consolas', monospace" font-size="7.5" font-weight="700" fill="#f5b738">HEAD B // LINEAGE</text>
        <text x="10" y="34" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#c4b89d">Multi-Class Clade Infer</text>
        <text x="10" y="48" font-family="'Space Mono', 'Consolas', monospace" font-size="7" fill="#ffd56b">L1 to L4 Clades</text>
        <text x="10" y="62" font-family="'Space Mono', 'Consolas', monospace" font-size="6.5" fill="#8f846d">Cross-Entropy Loss</text>
      </g>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <text x="35" y="365" font-family="'Space Mono', 'Consolas', monospace" font-size="8" fill="#f5b738">
    13,753 GENOMES // JOINT MULTI-TASK GNN // PHYLOGENY-AWARE TOPOLOGY
  </text>
</svg>
