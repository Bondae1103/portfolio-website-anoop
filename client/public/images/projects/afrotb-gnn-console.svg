<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gnn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#191610" />
      <stop offset="100%" stop-color="#12100a" />
    </linearGradient>
    <linearGradient id="gold-line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5b738" />
      <stop offset="100%" stop-color="#c48b4e" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#gnn-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#3d3322" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#f5b738" letter-spacing="1">AFROTB // PHYLOGENY-AWARE GRAPH NEURAL NETWORK</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="#9e9177">PYTORCH GEOMETRIC · 13,753 ISOLATES</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#3d3322" stroke-width="1" />

  <!-- Left: Phylogenetic Tree Dendrogram -->
  <g transform="translate(35, 75)">
    <rect x="0" y="0" width="220" height="235" fill="#16130d" stroke="#382e1c" />
    <text x="12" y="20" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#f5b738">PHYLOGENETIC DIVERGENCE</text>
    <text x="12" y="34" font-family="'Space Mono', monospace" font-size="7" fill="#8f846d">SNP Distance Matrix (N=13,753)</text>

    <!-- Tree Branches -->
    <path d="M 25 120 L 60 120 L 60 70 L 105 70 L 105 50 L 175 50" fill="none" stroke="#f5b738" stroke-width="1.5" />
    <path d="M 105 70 L 105 90 L 175 90" fill="none" stroke="#ffd56b" stroke-width="1.5" />
    <path d="M 60 120 L 60 170 L 110 170 L 110 150 L 175 150" fill="none" stroke="#c48b4e" stroke-width="1.5" />
    <path d="M 110 170 L 110 195 L 175 195" fill="none" stroke="#9e7b41" stroke-width="1.5" />

    <!-- Terminal Lineage Nodes -->
    <circle cx="175" cy="50" r="4" fill="#f5b738" />
    <text x="184" y="53" font-family="'Space Mono', monospace" font-size="7" fill="#f5b738">Lineage 4</text>

    <circle cx="175" cy="90" r="4" fill="#ffd56b" />
    <text x="184" y="93" font-family="'Space Mono', monospace" font-size="7" fill="#ffd56b">Lineage 2</text>

    <circle cx="175" cy="150" r="4" fill="#c48b4e" />
    <text x="184" y="153" font-family="'Space Mono', monospace" font-size="7" fill="#c48b4e">Lineage 1</text>

    <circle cx="175" cy="195" r="4" fill="#9e7b41" />
    <text x="184" y="198" font-family="'Space Mono', monospace" font-size="7" fill="#9e7b41">Lineage 3</text>

    <!-- Calibration Bar -->
    <line x1="25" y1="218" x2="85" y2="218" stroke="#f5b738" stroke-width="2" />
    <text x="92" y="221" font-family="'Space Mono', monospace" font-size="6.5" fill="#8f846d">500 SNPs divergence</text>
  </g>

  <!-- Right: GNN Topological Graph & Multi-Task Heads -->
  <g transform="translate(270, 75)">
    <!-- Topological Graph Canvas -->
    <rect x="0" y="0" width="295" height="150" fill="#16130d" stroke="#382e1c" />
    <text x="12" y="20" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#f5b738">GNN ISOLATE GRAPH (PyG)</text>
    <text x="12" y="34" font-family="'Space Mono', monospace" font-size="7" fill="#8f846d">edge_index + edge_weight (SNP Threshold)</text>

    <!-- Graph Edges -->
    <line x1="55" y1="75" x2="115" y2="55" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="55" y1="75" x2="105" y2="105" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="115" y1="55" x2="185" y2="70" stroke="#f5b738" stroke-width="1.5" />
    <line x1="105" y1="105" x2="185" y2="70" stroke="#f5b738" stroke-width="1.5" />
    <line x1="115" y1="55" x2="160" y2="115" stroke="#4a3e28" stroke-width="1.2" />
    <line x1="185" y1="70" x2="250" y2="60" stroke="#ffd56b" stroke-width="1.5" />
    <line x1="185" y1="70" x2="245" y2="110" stroke="#f5b738" stroke-width="1.5" />
    <line x1="160" y1="115" x2="245" y2="110" stroke="#4a3e28" stroke-width="1.2" />

    <!-- Graph Nodes -->
    <circle cx="55" cy="75" r="5" fill="#3d3322" stroke="#8a7959" />
    <circle cx="115" cy="55" r="6" fill="#1f1a12" stroke="#f5b738" stroke-width="1.5" />
    <circle cx="105" cy="105" r="5" fill="#1f1a12" stroke="#c48b4e" stroke-width="1.5" />
    <circle cx="185" cy="70" r="9" fill="#292015" stroke="#f5b738" stroke-width="2" />
    <text x="181" y="73" font-family="'Space Mono', monospace" font-size="7" font-weight="700" fill="#f5b738">G</text>
    <circle cx="160" cy="115" r="5" fill="#3d3322" stroke="#8a7959" />
    <circle cx="250" cy="60" r="7" fill="#1f1a12" stroke="#ffd56b" stroke-width="1.5" />
    <circle cx="245" cy="110" r="6" fill="#1f1a12" stroke="#f5b738" stroke-width="1.5" />

    <!-- Joint Multi-Task Heads -->
    <g transform="translate(0, 160)">
      <!-- Head 1 -->
      <rect x="0" y="0" width="142" height="75" fill="#1b1710" stroke="#f5b738" stroke-width="1.2" />
      <text x="10" y="20" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#f5b738">HEAD A // AMR PREDICTION</text>
      <text x="10" y="38" font-family="'Space Mono', monospace" font-size="7" fill="#c4b89d">12 WHO Drug Phenotypes</text>
      <text x="10" y="52" font-family="'Space Mono', monospace" font-size="7" fill="#ffd56b">RIF / INH / EMB / PZA</text>
      <text x="10" y="65" font-family="'Space Mono', monospace" font-size="6.5" fill="#8f846d">BCE Loss Optimization</text>

      <!-- Head 2 -->
      <rect x="153" y="0" width="142" height="75" fill="#1b1710" stroke="#4a3e28" />
      <text x="10" y="20" font-family="'Space Mono', monospace" font-size="7.5" font-weight="700" fill="#f5b738">HEAD B // LINEAGE</text>
      <text x="10" y="38" font-family="'Space Mono', monospace" font-size="7" fill="#c4b89d">Clade Sub-lineage Multi-Class</text>
      <text x="10" y="52" font-family="'Space Mono', monospace" font-size="7" fill="#ffd56b">L1 to L4 Clades</text>
      <text x="10" y="65" font-family="'Space Mono', monospace" font-size="6.5" fill="#8f846d">Cross-Entropy Loss</text>
    </g>
  </g>

  <!-- Footer Telemetry -->
  <text x="35" y="365" font-family="'Space Mono', monospace" font-size="8" fill="#f5b738">
    13,753 GENOMES // JOINT MULTI-TASK GNN // PHYLOGENY-AWARE TOPOLOGY
  </text>
</svg>
