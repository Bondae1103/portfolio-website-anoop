<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141814" />
      <stop offset="100%" stop-color="#101310" />
    </linearGradient>
    <linearGradient id="rmsd-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2b84b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f2b84b" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#card-bg4)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#2d382c" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', monospace" font-size="10" fill="#f2b84b" letter-spacing="1">MOLECULAR DYNAMICS // GROMACS + BIO3D TRAJECTORY</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="#71826f">HIV-1 PROTEASE</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#283327" stroke-width="1" />

  <!-- Main Chart: RMSD Trajectory (100ns simulation) -->
  <g transform="translate(45, 80)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9" fill="#8da088">RMSD TRAJECTORY [Å] VS SIMULATION TIME [ns]</text>
    
    <!-- Plot Box -->
    <rect x="30" y="15" width="310" height="150" fill="#131913" stroke="#2d3a2d" />
    
    <!-- Gridlines -->
    <line x1="30" y1="65" x2="340" y2="65" stroke="#243024" stroke-dasharray="2,2" />
    <line x1="30" y1="115" x2="340" y2="115" stroke="#243024" stroke-dasharray="2,2" />
    <line x1="130" y1="15" x2="130" y2="165" stroke="#243024" stroke-dasharray="2,2" />
    <line x1="230" y1="15" x2="230" y2="165" stroke="#243024" stroke-dasharray="2,2" />

    <!-- Trajectory Path (Equilibration -> Plateau at ~1.8 Angstroms) -->
    <path d="M 30 150 Q 50 110 80 85 T 140 75 T 200 70 T 260 72 T 320 68 T 340 70" fill="none" stroke="#f2b84b" stroke-width="2" />
    <path d="M 30 150 Q 50 110 80 85 T 140 75 T 200 70 T 260 72 T 320 68 T 340 70 L 340 165 L 30 165 Z" fill="url(#rmsd-fill)" />
    
    <!-- Ligand RMSD curve (oxidized green) -->
    <path d="M 30 160 Q 60 140 100 120 T 170 115 T 240 110 T 300 112 T 340 108" fill="none" stroke="#b8d18d" stroke-width="1.5" stroke-dasharray="3,3" />

    <!-- Y-axis labels -->
    <text x="22" y="70" font-family="'Space Mono', monospace" font-size="7" fill="#697a68" text-anchor="end">2.5Å</text>
    <text x="22" y="120" font-family="'Space Mono', monospace" font-size="7" fill="#697a68" text-anchor="end">1.5Å</text>
    <text x="22" y="165" font-family="'Space Mono', monospace" font-size="7" fill="#697a68" text-anchor="end">0.0Å</text>
  </g>

  <!-- DCCM Correlation Matrix Mini Grid -->
  <g transform="translate(405, 80)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9" fill="#8da088">DCCM CORRELATION</text>
    <rect x="0" y="15" width="140" height="150" fill="#131913" stroke="#2d3a2d" />
    
    <!-- Heatmap cells -->
    <g transform="translate(10, 25)">
      <rect x="0" y="0" width="28" height="28" fill="#f2b84b" opacity="0.9" />
      <rect x="30" y="0" width="28" height="28" fill="#4c604b" />
      <rect x="60" y="0" width="28" height="28" fill="#2d382c" />
      <rect x="90" y="0" width="28" height="28" fill="#b84c3b" opacity="0.7" />

      <rect x="0" y="30" width="28" height="28" fill="#4c604b" />
      <rect x="30" y="30" width="28" height="28" fill="#f2b84b" opacity="0.9" />
      <rect x="60" y="30" width="28" height="28" fill="#5c7a5a" />
      <rect x="90" y="30" width="28" height="28" fill="#2d382c" />

      <rect x="0" y="60" width="28" height="28" fill="#2d382c" />
      <rect x="30" y="60" width="28" height="28" fill="#5c7a5a" />
      <rect x="60" y="60" width="28" height="28" fill="#f2b84b" opacity="0.9" />
      <rect x="90" y="60" width="28" height="28" fill="#4c604b" />

      <rect x="0" y="90" width="28" height="28" fill="#b84c3b" opacity="0.7" />
      <rect x="30" y="90" width="28" height="28" fill="#2d382c" />
      <rect x="60" y="90" width="28" height="28" fill="#4c604b" />
      <rect x="90" y="90" width="28" height="28" fill="#f2b84b" opacity="0.9" />
    </g>
  </g>

  <!-- Metrics Tag -->
  <text x="35" y="365" font-family="'Space Mono', monospace" font-size="8" fill="#b8d18d">4 TRAJECTORY MEASURES // RMSD · RMSF · DCCM · RADIUS OF GYRATION</text>
</svg>
