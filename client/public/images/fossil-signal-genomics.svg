<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141814" />
      <stop offset="100%" stop-color="#101310" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#card-bg)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#2d382c" stroke-width="1" />
  
  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', monospace" font-size="10" fill="#f2b84b" letter-spacing="1">VOLCANO PLOT // FEATURE SELECTION CONSENSUS</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="#71826f">N = 12 BIOMARKERS</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#283327" stroke-width="1" />

  <!-- Axes -->
  <line x1="80" y1="330" x2="520" y2="330" stroke="#485947" stroke-width="1.5" />
  <line x1="300" y1="80" x2="300" y2="330" stroke="#354534" stroke-width="1" stroke-dasharray="3,3" />
  <line x1="80" y1="80" x2="80" y2="330" stroke="#485947" stroke-width="1.5" />

  <!-- Threshold lines -->
  <line x1="80" y1="180" x2="520" y2="180" stroke="#b84c3b" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />
  <text x="525" y="183" font-family="'Space Mono', monospace" font-size="8" fill="#b84c3b">p &lt; 0.01</text>

  <!-- Non-significant background points -->
  <g fill="#374536" opacity="0.6">
    <circle cx="280" cy="310" r="2.5" /><circle cx="310" cy="295" r="3" /><circle cx="290" cy="280" r="2" />
    <circle cx="325" cy="305" r="2.5" /><circle cx="270" cy="260" r="3" /><circle cx="330" cy="270" r="2" />
    <circle cx="260" cy="290" r="2.5" /><circle cx="340" cy="285" r="3" /><circle cx="295" cy="240" r="2.5" />
    <circle cx="305" cy="250" r="2" /><circle cx="250" cy="230" r="3" /><circle cx="350" cy="240" r="2.5" />
    <circle cx="285" cy="210" r="2" /><circle cx="315" cy="205" r="3" /><circle cx="275" cy="190" r="2.5" />
  </g>

  <!-- Significant Biomarkers (Consensus Selected) -->
  <g fill="#f2b84b">
    <circle cx="160" cy="120" r="5" /><text x="145" y="110" font-family="'Space Mono', monospace" font-size="8" fill="#f2b84b">GENE_01</text>
    <circle cx="130" cy="140" r="4.5" />
    <circle cx="180" cy="155" r="4" />
    <circle cx="210" cy="165" r="4" />
    <circle cx="430" cy="115" r="5" /><text x="435" y="105" font-family="'Space Mono', monospace" font-size="8" fill="#f2b84b">GENE_07</text>
    <circle cx="460" cy="135" r="4.5" />
    <circle cx="410" cy="145" r="4" />
    <circle cx="390" cy="160" r="4" />
    <circle cx="140" cy="100" r="4" /><circle cx="470" cy="125" r="4.5" />
    <circle cx="195" cy="130" r="3.5" /><circle cx="445" cy="150" r="3.5" />
  </g>

  <!-- Axes Labels -->
  <text x="300" y="355" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="#8da088">log2 Fold Change</text>
  <text x="50" y="205" transform="rotate(-90 50,205)" text-anchor="middle" font-family="'Space Mono', monospace" font-size="9" fill="#8da088">-log10 p-value</text>
  <text x="35" y="375" font-family="'Space Mono', monospace" font-size="8" fill="#b8d18d">SHAP + LOOCV ROBUSTNESS CONFIRMED</text>
</svg>
