<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141814" />
      <stop offset="100%" stop-color="#101310" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#card-bg2)" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#2d382c" stroke-width="1" />

  <!-- Header -->
  <text x="35" y="45" font-family="'Space Mono', monospace" font-size="10" fill="#f2b84b" letter-spacing="1">VARIANT CLASSIFIER // AWS LAMBDA INFERENCE</text>
  <text x="565" y="45" text-anchor="end" font-family="'Space Mono', monospace" font-size="9" fill="#71826f">M. TUBERCULOSIS VCF</text>
  <line x1="35" y1="58" x2="565" y2="58" stroke="#283327" stroke-width="1" />

  <!-- VCF Variant Barcode Track -->
  <g transform="translate(35, 80)">
    <text x="0" y="0" font-family="'Space Mono', monospace" font-size="9" fill="#8da088">CHROMOSOME 1 : RESISTANCE MUTATIONS (SNPs/INDELs)</text>
    <rect x="0" y="10" width="530" height="24" fill="#1b221b" stroke="#374536" />
    <!-- SNP Markers -->
    <rect x="45" y="10" width="4" height="24" fill="#f2b84b" />
    <rect x="88" y="10" width="3" height="24" fill="#b8d18d" />
    <rect x="140" y="10" width="6" height="24" fill="#f2b84b" />
    <rect x="230" y="10" width="4" height="24" fill="#f2b84b" />
    <rect x="310" y="10" width="3" height="24" fill="#b84c3b" />
    <rect x="420" y="10" width="5" height="24" fill="#f2b84b" />
    <rect x="490" y="10" width="4" height="24" fill="#b8d18d" />
  </g>

  <!-- Serverless Cloud Inference Pipeline Flow -->
  <g transform="translate(35, 160)">
    <!-- S3 Trigger -->
    <rect x="0" y="0" width="140" height="85" fill="#171e17" stroke="#354535" />
    <text x="12" y="24" font-family="'Space Mono', monospace" font-size="9" fill="#f2b84b">S3 BUCKET</text>
    <text x="12" y="44" font-family="'Space Mono', monospace" font-size="8" fill="#8da088">Event: PutObject</text>
    <text x="12" y="60" font-family="'Space Mono', monospace" font-size="8" fill="#60705f">*.vcf.gz upload</text>

    <!-- Arrow 1 -->
    <line x1="140" y1="42" x2="190" y2="42" stroke="#f2b84b" stroke-width="1.5" stroke-dasharray="4,3" />
    <polygon points="190,42 182,38 182,46" fill="#f2b84b" />

    <!-- Lambda / Docker -->
    <rect x="195" y="0" width="150" height="85" fill="#171e17" stroke="#354535" />
    <text x="12" y="24" font-family="'Space Mono', monospace" font-size="9" fill="#f2b84b">AWS LAMBDA</text>
    <text x="12" y="44" font-family="'Space Mono', monospace" font-size="8" fill="#8da088">cyvcf2 + Docker</text>
    <text x="12" y="60" font-family="'Space Mono', monospace" font-size="8" fill="#60705f">Random Forest</text>

    <!-- Arrow 2 -->
    <line x1="345" y1="42" x2="395" y2="42" stroke="#f2b84b" stroke-width="1.5" stroke-dasharray="4,3" />
    <polygon points="395,42 387,38 387,46" fill="#f2b84b" />

    <!-- Output Accuracy Gauge -->
    <rect x="400" y="0" width="130" height="85" fill="#171e17" stroke="#f2b84b" stroke-width="1.5" />
    <text x="12" y="24" font-family="'Space Mono', monospace" font-size="9" fill="#f2b84b">INFERENCE</text>
    <text x="12" y="55" font-family="'Barlow Condensed', sans-serif" font-size="28" font-weight="700" fill="#f2b84b">82%</text>
    <text x="65" y="52" font-family="'Space Mono', monospace" font-size="8" fill="#b8d18d">ACCURACY</text>
    <text x="12" y="74" font-family="'Space Mono', monospace" font-size="7" fill="#8da088">RESISTANT: RIF/INH</text>
  </g>

  <!-- Footer Tag -->
  <text x="35" y="365" font-family="'Space Mono', monospace" font-size="8" fill="#b8d18d">AUTOMATED CLOUD GENOMIC PIPELINE // SERVERLESS INFERENCE</text>
</svg>
