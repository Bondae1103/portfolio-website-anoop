    <rect x="280" y="90" width="85" height="15" fill="#b8d18d" />
    <text x="284" y="101" font-family="'Space Mono', monospace" font-size="7" font-weight="700" fill="#101310">SEPTORIA 88.5%</text>

    <!-- Scan crosshairs -->
