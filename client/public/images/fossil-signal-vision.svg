    <line x1="245" y1="25" x2="245" y2="35" stroke="#f2b84b" stroke-width="1" />
  </g>

  <!-- Metrics Bar -->
  <text x="35" y="365" font-family="'Space Mono', monospace" font-size="8" fill="#b8d18d">CVAT ANNOTATED // 78% VALIDATION ACCURACY // AGRITHON 2025</text>
