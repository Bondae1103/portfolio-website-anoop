    <line x1="220" y1="135" x2="250" y2="70" stroke="#365039" stroke-width="1.5" />
    <line x1="270" y1="105" x2="250" y2="160" stroke="#365039" stroke-width="1.5" />
    <line x1="310" y1="75" x2="330" y2="120" stroke="#365039" stroke-width="1.5" />

    <!-- YOLO Bounding Box 1 (Detected Pathogen) -->
    <rect x="180" y="55" width="130" height="95" fill="none" stroke="#f2b84b" stroke-width="2" stroke-dasharray="4,2" />
    <rect x="180" y="38" width="125" height="17" fill="#f2b84b" />
    <text x="185" y="50" font-family="'Space Mono', monospace" font-size="8" font-weight="700" fill="#101310">EARLY_BLIGHT 94.2%</text>
    <circle cx="245" cy="100" r="14" fill="#b84c3b" opacity="0.4" />
    <circle cx="245" cy="100" r="5" fill="#f2b84b" />

